[project]
name = "osr-cd"
version = "0.1.0"
description = "Two-stage OSR-CD preprocessing and LLM prediction for graph-grounded datasets."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<2",
  "pandas>=2.0",
  "networkx>=3.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
bert = [
  "torch>=2.0",
  "transformers>=4.38",
  "safetensors>=0.4",
]
llm = [
  "torch>=2.0",
  "transformers>=4.37",
  "accelerate>=0.27",
  "sentencepiece>=0.1.99",
  "safetensors>=0.4",
]
dgl = [
  "dgl>=1.1,<2",
]
